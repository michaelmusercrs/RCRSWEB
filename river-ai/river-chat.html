<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>River — RCRS AI Assistant</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #16213e;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 2px solid #39FF14;
    flex-shrink: 0;
  }
  .logo {
    width: 48px;
    height: 48px;
    background: #39FF14;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    color: #1a1a2e;
  }
  .header-text h1 {
    font-size: 20px;
    color: #39FF14;
  }
  .header-text p {
    font-size: 12px;
    color: #888;
  }
  .status-badge {
    margin-left: auto;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .status-badge.online { background: #39FF1422; color: #39FF14; border: 1px solid #39FF1444; }
  .status-badge.offline { background: #ff444422; color: #ff4444; border: 1px solid #ff444444; }
  .status-badge.thinking { background: #ffaa0022; color: #ffaa00; border: 1px solid #ffaa0044; }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .message {
    max-width: 80%;
    padding: 14px 18px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .message.user {
    align-self: flex-end;
    background: #0f3460;
    border-bottom-right-radius: 4px;
    color: #fff;
  }
  .message.assistant {
    align-self: flex-start;
    background: #16213e;
    border-bottom-left-radius: 4px;
    border: 1px solid #39FF1433;
  }
  .message.system {
    align-self: center;
    background: #2a2a4a;
    color: #888;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 8px;
  }
  .message .sender {
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .message.user .sender { color: #6db3f2; }
  .message.assistant .sender { color: #39FF14; }

  .typing-indicator {
    align-self: flex-start;
    padding: 14px 18px;
    background: #16213e;
    border-radius: 16px;
    border: 1px solid #39FF1433;
    display: none;
  }
  .typing-indicator.visible { display: flex; gap: 6px; align-items: center; }
  .typing-indicator span {
    width: 8px; height: 8px;
    background: #39FF14;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  #input-area {
    padding: 16px 24px;
    background: #16213e;
    border-top: 1px solid #333;
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }
  #input-area textarea {
    flex: 1;
    background: #1a1a2e;
    color: #e0e0e0;
    border: 1px solid #444;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    min-height: 48px;
    max-height: 150px;
    outline: none;
    transition: border-color 0.2s;
  }
  #input-area textarea:focus { border-color: #39FF14; }
  #input-area textarea::placeholder { color: #666; }
  #send-btn {
    background: #39FF14;
    color: #1a1a2e;
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    align-self: flex-end;
  }
  #send-btn:hover { background: #2ecc0f; transform: scale(1.02); }
  #send-btn:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }

  .controls {
    display: flex;
    gap: 8px;
    padding: 8px 24px;
    background: #16213e;
  }
  .controls button {
    background: #2a2a4a;
    color: #aaa;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .controls button:hover { background: #3a3a5a; color: #fff; border-color: #39FF14; }

  #connection-error {
    display: none;
    background: #ff444422;
    color: #ff6666;
    padding: 16px 24px;
    text-align: center;
    font-size: 14px;
    border-bottom: 1px solid #ff444444;
  }
  #connection-error a { color: #ff8888; }
</style>
</head>
<body>

<header>
  <div class="logo">R</div>
  <div class="header-text">
    <h1>River</h1>
    <p>River City Roofing Solutions — AI Field Assistant</p>
  </div>
  <span id="status-badge" class="status-badge offline">Connecting...</span>
</header>

<div id="connection-error">
  Cannot connect to Ollama. Make sure Ollama is running.<br>
  Open a terminal and run: <code>ollama serve</code>
</div>

<div id="chat-container"></div>

<div class="typing-indicator" id="typing">
  <span></span><span></span><span></span>
</div>

<div class="controls">
  <button onclick="clearChat()">Clear Chat</button>
  <button onclick="exportChat()">Export Chat</button>
  <button onclick="startTraining()">Start Training Mode</button>
</div>

<div id="input-area">
  <textarea id="user-input" placeholder="Talk to River..." rows="1"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
    oninput="autoResize(this)"></textarea>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
const OLLAMA_URL = 'http://localhost:11434';
const MODEL = 'river';

let messages = [];
let isGenerating = false;

const chatContainer = document.getElementById('chat-container');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const typingIndicator = document.getElementById('typing');
const statusBadge = document.getElementById('status-badge');
const connectionError = document.getElementById('connection-error');

// Check if Ollama is running
async function checkConnection() {
  try {
    const res = await fetch(OLLAMA_URL + '/api/tags');
    if (res.ok) {
      const data = await res.json();
      const hasRiver = data.models && data.models.some(m => m.name.startsWith('river'));
      if (hasRiver) {
        statusBadge.textContent = 'Online';
        statusBadge.className = 'status-badge online';
        connectionError.style.display = 'none';
        return true;
      } else {
        statusBadge.textContent = 'Model Not Found';
        statusBadge.className = 'status-badge offline';
        connectionError.innerHTML = 'River model not found. Run: <code>ollama create river -f Modelfile</code>';
        connectionError.style.display = 'block';
        return false;
      }
    }
  } catch (e) {
    statusBadge.textContent = 'Offline';
    statusBadge.className = 'status-badge offline';
    connectionError.style.display = 'block';
    return false;
  }
}

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const sender = document.createElement('div');
  sender.className = 'sender';
  sender.textContent = role === 'user' ? 'Michael' : 'River';

  const text = document.createElement('div');
  text.textContent = content;

  div.appendChild(sender);
  div.appendChild(text);
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  return text;
}

function addSystemMessage(content) {
  const div = document.createElement('div');
  div.className = 'message system';
  div.textContent = content;
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isGenerating) return;

  const connected = await checkConnection();
  if (!connected) return;

  isGenerating = true;
  sendBtn.disabled = true;
  userInput.value = '';
  userInput.style.height = 'auto';

  addMessage('user', text);
  messages.push({ role: 'user', content: text });

  statusBadge.textContent = 'Thinking...';
  statusBadge.className = 'status-badge thinking';
  typingIndicator.classList.add('visible');

  try {
    const response = await fetch(OLLAMA_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        messages: messages,
        stream: true
      })
    });

    typingIndicator.classList.remove('visible');
    const textEl = addMessage('assistant', '');
    let fullResponse = '';

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value);
      const lines = chunk.split('\n').filter(l => l.trim());

      for (const line of lines) {
        try {
          const json = JSON.parse(line);
          if (json.message && json.message.content) {
            fullResponse += json.message.content;
            textEl.textContent = fullResponse;
            chatContainer.scrollTop = chatContainer.scrollHeight;
          }
        } catch (e) {}
      }
    }

    messages.push({ role: 'assistant', content: fullResponse });

  } catch (e) {
    typingIndicator.classList.remove('visible');
    addSystemMessage('Error: Could not get response from River. Is Ollama running?');
    console.error(e);
  }

  isGenerating = false;
  sendBtn.disabled = false;
  statusBadge.textContent = 'Online';
  statusBadge.className = 'status-badge online';
  userInput.focus();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function clearChat() {
  if (confirm('Clear the conversation? River will forget everything from this session.')) {
    messages = [];
    chatContainer.innerHTML = '';
    addSystemMessage('Chat cleared. Start a new conversation with River.');
  }
}

function exportChat() {
  let text = 'RIVER TRAINING SESSION — ' + new Date().toLocaleString() + '\n';
  text += '='.repeat(60) + '\n\n';
  for (const msg of messages) {
    const label = msg.role === 'user' ? 'MICHAEL' : 'RIVER';
    text += `[${label}]\n${msg.content}\n\n`;
  }
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `river-training-${new Date().toISOString().split('T')[0]}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  addSystemMessage('Chat exported to file.');
}

function startTraining() {
  if (messages.length > 0 && !confirm('This will clear the current chat and start training mode. Continue?')) return;
  messages = [];
  chatContainer.innerHTML = '';
  addSystemMessage('Training mode activated. River will start asking you questions.');

  // Send the training prompt automatically
  userInput.value = "Hey River — I'm Michael Muse, VP of RCRS. You've got all our company info loaded. Now I need you to learn from me directly. Ask me questions one at a time about our real field processes. Start with how we approach a homeowner's door. You already know the textbook — I want to give you the real answers from being on roofs every day. Start asking.";
  sendMessage();
}

// Init
async function init() {
  const connected = await checkConnection();
  if (connected) {
    addSystemMessage('River is online and ready. Type a message or click "Start Training Mode" to begin the training Q&A.');
  } else {
    addSystemMessage('Waiting for Ollama connection... Make sure Ollama is running.');
  }
  userInput.focus();
}

init();
// Re-check connection every 10 seconds
setInterval(checkConnection, 10000);
</script>

</body>
</html>
